[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bagaoji"
version = "0.2.0"
description = "扒稿机 —— 视频转文案，链接转原片。纯标准库，零依赖，零 API Key。"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "hope0719" }]
keywords = ["video", "transcript", "download", "xiaohongshu", "self-media", "文案提取"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
  "Topic :: Text Processing",
]

[project.urls]
Homepage = "https://github.com/hope0719/bagaoji"
Source = "https://github.com/hope0719/bagaoji"
Issues = "https://github.com/hope0719/bagaoji/issues"

[project.scripts]
bagaoji = "bagaoji.cli:main"

[tool.setuptools.packages.find]
include = ["bagaoji*"]
